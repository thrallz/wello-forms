  wello_save_and_test: Save and test connection
  wello_disconnect: Disconnect
  wello_vtiger_connected_as: Connected to Vtiger as %{name}
  wello_vtiger_button_title: Add a "Wello Forms" button in Vtiger
  wello_vtiger_button_steps: In Vtiger go to Menu → Platform → Module Designer → UI Actions, add a "Detail View Basic Button" for Organizations, Contacts, Leads or Deals, and paste this as the click action.
  wello_vtiger_button_modules: Supported modules are Organizations (Accounts), Contacts, Leads and Deals (Potentials). Contacts and deals linked to an organization are filed under that organization.
  wello_vtiger_not_configured: Vtiger is not connected yet. An admin can set it up in Settings → Vtiger.
  wello_client_assigned_to_someone_else: This client is assigned to %{name}. Ask them or your manager to send the form.
  wello_client_synced: Client details updated from Vtiger
  wello_sync_from_vtiger: Sync from Vtiger
