# Wello Forms - development stack
# Run on the Docker host:  docker compose -f docker-compose.dev.yml up -d --build
# Or in Portainer: Stacks > Add stack > Repository, compose path: docker-compose.dev.yml
# App:  http://<server>:3000      Dev emails: http://<server>:3000/letter_opener
name: wello-forms-dev

x-app: &app
  build:
    context: .
    dockerfile: docker/dev/Dockerfile
  image: wello-forms-dev:latest
  volumes:
    - .:/app
    - bundle:/usr/local/bundle
    - node_modules:/app/node_modules
    - packs:/app/public/packs
  environment: &app_env
    RAILS_ENV: development
    DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/wello_forms_dev
    DATABASE_HOST: db
    REDIS_URL: redis://redis:6379/0
    SECRET_KEY_BASE: ${SECRET_KEY_BASE:-dev_only_change_me_0123456789abcdef0123456789abcdef0123456789abcdef}
    SHAKAPACKER_DEV_SERVER_HOST: webpacker
    SHAKAPACKER_DEV_SERVER_PORT: "3035"
    WELLO_SKIP_SCHEMA_DUMP: "true"
    VTIGER_URL: ${VTIGER_URL:-}
    VTIGER_USERNAME: ${VTIGER_USERNAME:-}
    VTIGER_ACCESS_KEY: ${VTIGER_ACCESS_KEY:-}
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_started

services:
  app:
    <<: *app
    environment:
      <<: *app_env
      WELLO_PREPARE_DB: "true"
    ports:
      - "${APP_PORT:-3000}:3000"
    stdin_open: true
    tty: true

  webpacker:
    <<: *app
    command: ["bundle", "exec", "./bin/shakapacker-dev-server"]
    environment:
      <<: *app_env
      SHAKAPACKER_DEV_SERVER_HOST: 0.0.0.0
      WELLO_WAIT_FOR_DEPS: "true"

  db:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: wello_forms_dev
    volumes:
      - pg_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data

volumes:
  bundle:
  node_modules:
  packs:
  pg_data:
  redis_data:
